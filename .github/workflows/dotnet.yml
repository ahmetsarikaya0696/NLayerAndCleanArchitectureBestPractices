name: .NET 10 build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NLayerAndCleanArchitectureBestPractices.sln
      - name: Build
        run: dotnet build NLayerAndCleanArchitectureBestPractices.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test NLayerAndCleanArchitectureBestPractices.sln --configuration Release --no-build
